name: Feature request
description: Suggest an idea for this project.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the open issues first — the feature you have in mind may already be planned or
        discussed. Note this module is transport-only by design: it has no knowledge of what's
        being streamed (chat, notifications, etc.) — features that bake in a specific payload
        format are likely out of scope here and belong in the consuming application instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the desired solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
