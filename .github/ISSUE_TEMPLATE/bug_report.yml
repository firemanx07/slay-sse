name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Module version (go.mod require line), or commit SHA if running from a fork/branch.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Broker (Subscribe/Unsubscribe/Publish)
        - Handler (HTTP streaming)
        - ReplayStore / Last-Event-ID
        - Event encoding
        - Example
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet reproducing the issue, if possible.
      render: go
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / stack trace
      render: shell
